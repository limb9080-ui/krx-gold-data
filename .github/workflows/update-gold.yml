
name: Update KRX Gold Data

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gold:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch KRX Gold Data
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          url = "https://api.stock.naver.com/marketindex/metals/M04020000/prices?page=1&pageSize=20"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise RuntimeError(f"HTTP error: {response.status}")
              raw = json.loads(response.read().decode("utf-8"))

          if not isinstance(raw, list) or not raw:
              raise RuntimeError("KRX data is empty or invalid")

          for item in raw:
              if "localTradedAt" not in item or "closePrice" not in item:
                  raise RuntimeError("Required price fields are missing")

          result = {
              "source": url,
              "fetchedAt": datetime.now(timezone.utc).isoformat(),
              "proxyStatus": 200,
              "data": raw
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/krx-gold.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Success: {len(raw)} records fetched")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/krx-gold.json
          git diff --cached --quiet || (
            git commit -m "Update daily KRX gold prices"
            git push
          )
